packages:
  - apps/*
  - packages/*

# One version of each shared tool across the monorepo (pnpm catalogs).
# TypeScript stays on 6 until openapi-typescript and drizzle-kit support the
# TypeScript 7 compiler API (spec 0001, follow up from the 2026-10-22 doc check).
catalog:
  typescript: ~6.0.3
  zod: ^4.6.7
  "@types/node": ^24.0.0
  # React 19 types, shared by the web app and the design system package.
  "@types/react": ^19.3.0
  # React DOM's types, shared by the web app and the design system package (its portals: Dialog, Drawer, PrintPreview).
  "@types/react-dom": ^19.3.0

# esbuild (through tsx, and directly in @vetora/ui for the artifact's bundle): its install script only checks its binary.
onlyBuiltDependencies:
  - esbuild
  # lefthook: its install script wires the git hooks on pnpm install (skipped when CI is set).
  - lefthook
