server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness for kamal-proxy and the uptime check (spec 0001, "Runtime and deployment topology").
    location = /up {
        default_type text/plain;
        return 200 'OK';
    }

    # Written at container start from the environment (see 10-runtime-config.sh); never cached.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Source maps never leave the build: Sentry gets them from CI, the browser never does.
    location ~ \.map$ {
        return 404;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client rendered app: every other path is index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
