# Continuous integration (spec 0001, "CI"). The checks (scope feature 2): Biome finds nothing to lint or format,
# the monorepo builds and typechecks, the committed OpenAPI types match the API, and the tests pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm turbo run build typecheck
      - name: OpenAPI document and generated types are current
        run: |
          pnpm openapi
          git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated
      - name: Start Postgres for the database tests
        run: docker compose up -d --wait postgres
      - run: pnpm test
        env:
          # The compose init script's local values (infra/postgres/init/01-vetora.sql); the tests use vetora_test.
          DATABASE_URL_MIGRATOR: postgres://vetora_migrator:vetora_migrator@localhost:5432/vetora
          DATABASE_URL_DIRECT: postgres://vetora_app:vetora_app@localhost:5432/vetora
