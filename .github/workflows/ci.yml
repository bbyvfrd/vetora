# Continuous integration (spec 0001, "CI"). The checks (scope feature 2): Biome finds nothing to lint or format,
# the monorepo builds and typechecks, the committed OpenAPI types match the API, and the tests pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # db:check reads from the history when each migration folder was committed (apps/api/src/platform/db/migration-order.ts).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm turbo run build typecheck
      - name: Migration sets are in order (spec 0001, Migrations)
        run: pnpm --filter @vetora/api db:check
      - name: The control tables hold what Better Auth writes (spec #18, auth check schema)
        # The committed configuration, with no database: the pool is created and never connected.
        run: pnpm --filter @vetora/api auth:check
        env:
          PUBLIC_ORIGIN: http://localhost:5173
          BETTER_AUTH_SECRET: ci-only-secret-for-the-schema-check-0000
          DATABASE_URL_POOLED: postgres://nobody:nobody@127.0.0.1:1/nowhere
          DATABASE_URL_DIRECT: postgres://nobody:nobody@127.0.0.1:1/nowhere
      - name: OpenAPI document and generated types are current
        run: |
          pnpm openapi
          git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated
      - name: Start Postgres for the database tests
        # compose.yaml takes its project name and ports from the checkout's .env (one slot per checkout,
        # docs/agents/worktrees.md); the runner is a plain checkout, slot 0, which .env.example describes.
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres
      - run: pnpm test
        env:
          # The compose init script's local values (infra/postgres/init/01-vetora.sql); the tests use vetora_test.
          DATABASE_URL_MIGRATOR: postgres://vetora_migrator:vetora_migrator@localhost:5432/vetora
          DATABASE_URL_DIRECT: postgres://vetora_app:vetora_app@localhost:5432/vetora
